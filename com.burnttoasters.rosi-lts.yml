app-id: com.burnttoasters.rosi-lts
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "23.08"
command: rosi-lts
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
modules:
  - name: rosi-lts
    buildsystem: simple
    build-commands:
      - install -Dm755 rosi-lts -t /app/bin/
    sources:
      - type: dir
        path: .
